---
- name: Install and configure ControlUp Edge DX Linux Agent
  hosts: all
  become: true
  gather_facts: false

  vars:
    controlup_installer: /tmp/sip-install-v2.sh
    controlup_installer_url: "https://downloads.sip.controlup.com/sip-install-v2.sh"
    controlup_service: avaceesip

  tasks:

    - name: Check ControlUp survey variables
      fail:
        msg: "Missing tenant. Check Tower survey variable cu_tenant."
      when: cu_tenant is not defined or (cu_tenant | default('') | length == 0)

    - name: Check registration code variable
      fail:
        msg: "Missing registration code. Check Tower survey variable cu_regcode."
      when: cu_regcode is not defined or (cu_regcode | default('') | length == 0)

    - name: Download ControlUp installer
      get_url:
        url: "{{ controlup_installer_url }}"
        dest: "{{ controlup_installer }}"
        mode: '0755'
        timeout: 60

    - name: Install or update ControlUp Edge DX agent
      shell: >
        /bin/sh {{ controlup_installer }}
        -t {{ cu_tenant | quote }}
        -d {{ cu_regcode | quote }}
      register: controlup_install
      no_log: true
      ignore_errors: true

    - name: Report ControlUp installation failure
      fail:
        msg: >-
          ControlUp installer failed on {{ inventory_hostname }}.
          Exit code: {{ controlup_install.rc }}.
          Check tenant, registration code, installer
          compatibility, and outbound network connectivity.
      when: controlup_install.rc != 0

    - name: Check ControlUp service exists
      command: systemctl cat avaceesip
      register: controlup_unit
      changed_when: false
      failed_when: false

    - name: Fail if ControlUp service is missing
      fail:
        msg: "ControlUp service avaceesip was not found."
      when: controlup_unit.rc != 0

    - name: Start and enable ControlUp service
      systemd:
        name: "{{ controlup_service }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Verify ControlUp service is active
      command: systemctl is-active avaceesip
      register: controlup_status
      changed_when: false
      failed_when: controlup_status.stdout != "active"

    - name: Display installation result
      debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "ControlUp installation completed"
          - "Service: {{ controlup_service }}"
          - "Status: {{ controlup_status.stdout }}"
          - "Verify cloud registration in ControlUp portal"
